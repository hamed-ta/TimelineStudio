<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeline Studio</title>
    <meta
      name="description"
      content="Create, edit, and export personal timelines with events, periods, markers, notes, age readouts, and Gregorian or Persian calendar display."
    />
    <meta name="application-name" content="Timeline Studio" />
    <meta name="apple-mobile-web-app-title" content="Timeline Studio" />
    <meta name="theme-color" content="#1677ff" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Timeline Studio" />
    <meta property="og:title" content="Timeline Studio" />
    <meta
      property="og:description"
      content="Create, edit, and export personal timelines with events, periods, markers, notes, age readouts, and Gregorian or Persian calendar display."
    />
    <meta property="og:url" content="https://hamed-ta.github.io/TimelineStudio/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Timeline Studio" />
    <meta
      name="twitter:description"
      content="Create, edit, and export personal timelines with events, periods, markers, notes, age readouts, and Gregorian or Persian calendar display."
    />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("timeline-studio-theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
